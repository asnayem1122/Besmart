name: Deploy Besmart to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Frontend
        run: |
          npm install
          npm run build

      - name: Generate Static index.html
        run: |
          CSS_FILE=$(cat public/build/manifest.json | python3 -c "import sys,json; m=json.load(sys.stdin); [print(v['file']) for v in m.values() if v['file'].endswith('.css')]" | head -1)
          JS_FILE=$(cat public/build/manifest.json | python3 -c "import sys,json; m=json.load(sys.stdin); [print(v['file']) for v in m.values() if v['file'].endswith('.js')]" | head -1)
          
          mkdir -p _site
          cp -r public/build _site/
          
          cat > _site/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en" class="h-full">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Besmart — Shop Smart. Buy Better.</title>
              <meta name="description" content="Modern Full-Stack E-Commerce and B2B Wholesale Marketplace Platform">
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
              <link rel="stylesheet" href="build/${CSS_FILE}">
          </head>
          <body class="h-full">
              <div id="app"></div>
              <script type="module" src="build/${JS_FILE}"></script>
          </body>
          </html>
          HTMLEOF
          
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
          echo "Built with CSS=$CSS_FILE JS=$JS_FILE"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
